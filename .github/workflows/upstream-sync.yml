name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream into a dedicated branch
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/pmariglia/foul-play.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b sync/upstream-automatic
          git merge --no-edit upstream/main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.merge.outputs.changed == 'true'
        with:
          python-version: '3.13'
      - name: Validate merged changes
        if: steps.merge.outputs.changed == 'true'
        run: |
          pip install -r requirements-dev.txt
          python -m compileall -q fp
          ruff check
          ruff format --check --diff
          pytest tests
          node --check fp/gui/foul-play.user.js
          node --test tests/userscript.test.cjs
      - name: Publish tested sync for review
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin HEAD:refs/heads/sync/upstream-automatic
          if [ -z "$(gh pr list --head sync/upstream-automatic --base main --json number --jq '.[].number')" ]; then
            gh pr create --base main --head sync/upstream-automatic \
              --title 'Sync latest pmariglia/foul-play' \
              --body 'Merge upstream while preserving local features. Compile, lint, formatting, Python tests and userscript checks passed in the Sync upstream workflow. Review before merging; conflicts stop the workflow without changing main.'
          fi
