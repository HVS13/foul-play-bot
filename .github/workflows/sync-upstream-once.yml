name: One-time upstream sync

on:
  push:
    branches:
      - agent/upstream-sync-2026-08

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sync branch
        uses: actions/checkout@v4
        with:
          ref: agent/upstream-sync-2026-08
          fetch-depth: 0

      - name: Merge upstream main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pmariglia/foul-play.git
          git fetch upstream main

          # Start a real merge so rename/delete history is handled by git.
          git merge --no-commit --no-ff upstream/main || true

          # Your custom branch predates a large upstream refactor. For paths that
          # conflict, take the current upstream version. Non-conflicting custom
          # files and changes remain. Custom behavior is reapplied after this sync.
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if git ls-files -u -- "$path" | awk '$3 == 3 {found=1} END {exit !found}'; then
              git checkout --theirs -- "$path"
              git add -- "$path"
            else
              git rm -f --ignore-unmatch -- "$path"
            fi
          done < <(git diff --name-only --diff-filter=U)

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain"
            git status --short
            exit 1
          fi

          # Remove this one-time workflow from the resulting branch.
          rm -f .github/workflows/sync-upstream-once.yml
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to sync"
            exit 0
          fi

          git commit -m "Sync upstream main through c90ecd3"
          git push origin HEAD:agent/upstream-sync-2026-08
