name: Format custom port once

on:
  push:
    branches:
      - agent/upstream-sync-2026-08

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/upstream-sync-2026-08
          fetch-depth: 0
      - name: Apply repository formatter
        run: |
          python -m pip install ruff==0.6.5
          ruff format fp/config.py fp/custom_features.py fp/run_battle.py fp/search/main.py fp/websocket_client.py fp/modes/base.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fp/config.py fp/custom_features.py fp/run_battle.py fp/search/main.py fp/websocket_client.py fp/modes/base.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format ported custom features"
          git push origin HEAD:agent/upstream-sync-2026-08
