name: Port custom hooks once

on:
  push:
    branches:
      - agent/upstream-sync-2026-08

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/upstream-sync-2026-08
          fetch-depth: 0
      - name: Patch upstream hook points
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          state_path = Path("fp/battle/state.py")
          state = state_path.read_text()
          old = '''        self.request_json = None
                  self.msg_list = []
                  self.opponent_team_preview_affinities = None
          '''
          new = '''        self.request_json = None
                  self.msg_list = []
                  self.opponent_team_preview_affinities = None
                  self.started_at = None
                  self.search_times_ms = []
                  self.decision_log = []
                  self.decision_count = 0
                  self.win_reason = None
                  self.replay_url = None
                  self.replay_saved = False
                  self.opponent_tendencies = {
                      "actions": 0,
                      "moves": 0,
                      "switches": 0,
                      "protects": 0,
                  }
          '''
          if old not in state:
              raise SystemExit("Battle telemetry insertion point not found")
          state_path.write_text(state.replace(old, new, 1))

          base_path = Path("fp/modes/base.py")
          base = base_path.read_text()
          base = base.replace("import random\n", "import random\nimport time\n", 1)
          base = base.replace(
              "from fp.search.main import find_best_move\n",
              "from fp.search.main import find_best_move_with_policy\n"
              "from fp.custom_features import log_suggested_moves, record_decision\n",
              1,
          )
          start = base.index("async def async_pick_move(battle):")
          end = base.index("\n\nasync def handle_team_preview", start)
          replacement = '''async def async_pick_move(battle):
              started = time.time()
              battle_copy = deepcopy(battle)
              if not battle_copy.team_preview:
                  battle_copy.user.update_from_request_json(battle_copy.request_json)

              loop = asyncio.get_event_loop()
              with concurrent.futures.ThreadPoolExecutor() as pool:
                  best_move, policy = await loop.run_in_executor(
                      pool, find_best_move_with_policy, battle_copy
                  )

              elapsed_ms = int((time.time() - started) * 1000)
              battle.user.last_selected_move = LastUsedMove(
                  battle.user.active.name,
                  best_move.removesuffix("-tera").removesuffix("-mega"),
                  battle.turn,
              )
              try:
                  record_decision(battle, best_move, elapsed_ms, policy)
              except Exception as exc:
                  logger.debug("Telemetry capture failed: %s", exc)
              if FoulPlayConfig.suggest_only:
                  log_suggested_moves(battle, policy)
              return format_decision(battle_copy, best_move)
          '''
          base = base[:start] + replacement + base[end:]
          base_path.write_text(base)
          PY

          python -m compileall -q fp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fp/battle/state.py fp/modes/base.py
          git commit -m "Port telemetry and suggest-only hooks"
          git push origin HEAD:agent/upstream-sync-2026-08
