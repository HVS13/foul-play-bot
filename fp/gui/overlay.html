<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foul Play Overlay</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      background: transparent;
      color: #f8fafc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 16px;
    }
    .overlay {
      width: min(430px, calc(100vw - 32px));
      background: rgba(8, 12, 18, .88);
      border: 1px solid rgba(148, 163, 184, .28);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(0,0,0,.28);
    }
    .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 9px; }
    .brand { font-weight: 800; letter-spacing: -.03em; }
    .meta { color: #a8b1c2; font-size: 12px; }
    .row { display: grid; grid-template-columns: 1fr 72px; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(148,163,184,.18); }
    .row:first-of-type { border-top: 0; }
    .move { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    .weight { text-align: right; color: #7dd3fc; font-variant-numeric: tabular-nums; font-weight: 750; }
    .footer { display: flex; flex-wrap: wrap; gap: 10px; color: #a8b1c2; font-size: 11px; margin-top: 8px; }
    .empty { color: #a8b1c2; padding: 8px 0; }
  </style>
</head>
<body>
  <section class="overlay">
    <div class="top">
      <div class="brand">Foul Play</div>
      <div class="meta" id="battle">waiting</div>
    </div>
    <div id="policy"><div class="empty">Waiting for a decision…</div></div>
    <div class="footer">
      <span id="risk">Risk —</span>
      <span id="confidence">Confidence —</span>
      <span id="search">Search —</span>
    </div>
  </section>

  <script>
    const text = (id, value) => document.getElementById(id).textContent = value;

    function render(state) {
      const battle = state.battle;
      text('battle', battle ? `${battle.format || ''} · T${battle.turn || 0}` : 'waiting');
      const result = state.decision?.result;
      const policy = result?.policy || [];
      const root = document.getElementById('policy');
      root.replaceChildren();
      if (!policy.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Waiting for a decision…';
        root.appendChild(empty);
      } else {
        policy.slice(0, 3).forEach(item => {
          const row = document.createElement('div');
          row.className = 'row';
          const move = document.createElement('div');
          move.className = 'move';
          move.textContent = item.move;
          const weight = document.createElement('div');
          weight.className = 'weight';
          weight.textContent = `${(item.weight * 100).toFixed(1)}%`;
          row.append(move, weight);
          root.appendChild(row);
        });
      }
      text('risk', `Risk ${result?.risk_mode || '—'}`);
      text('confidence', `Confidence ${result?.confidence_ratio == null ? '—' : result.confidence_ratio.toFixed(2)}`);
      text('search', `Search ${result?.total_search_time_ms == null ? '—' : result.total_search_time_ms + 'ms'}`);
    }

    async function refresh() {
      try {
        const response = await fetch('/api/state', { cache: 'no-store' });
        if (response.ok) render(await response.json());
      } catch (_) {}
    }
    refresh();
    setInterval(refresh, 500);
  </script>
</body>
</html>
